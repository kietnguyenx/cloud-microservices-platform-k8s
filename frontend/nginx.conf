server {
    listen 80;
    server_name localhost;
    
    # 1. Phục vụ giao diện tĩnh (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy chuyển tiếp các request API sang Backend
    location /api/ {
       proxy_pass http://backend:8000;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(products|categories|orders|signup|login|me|healthz|readyz|metrics|docs|openapi.json) {
       proxy_pass http://backend:8000;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Trang hiển thị lỗi server nội bộ
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}