name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1 Kéo mã nguồn từ Github về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4 

    # 2 Thiết lập môi trường python để kiểm tra lỗi cú pháp 
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3 Chạy test cú pháp cơ bản của Backend
    - name: Install dependencies & test syntax
      run: | 
        pip install -r backend/requirements.txt  
        python -m py_compile backend/main.py

    # 4 Cài đặt Docker Buildx để tăng tốc build image
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    # 5 Đăng nhập vào Docker Hub (Cần thiết để đưa code lên Github)
    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    # 6 Đóng gói và đẩy backend image
    - name: Build and push backend image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ryannguyxn/todo-backend:latest

    # 7 Đóng gói và đẩy frontend image
    - name: Build and push frontend image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ryannguyxn/todo-frontend:latest

    # 8 Đóng gói và đẩy worker image
    - name: Build and push worker image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./worker-service
        push: true
        tags: ryannguyxn/todo-worker:latest