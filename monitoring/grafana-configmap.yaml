apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: default
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Microservices Dashboards'
        orgId: 1
        folder: 'Microservices'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-microservices-dashboard
  namespace: default
data:
  microservices-dashboard.json: |
    {
        "annotations": {
            "list": []
        },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 1,
        "id": null,
        "links": [],
        "liveNow": false,
        "panels": [
            {
                "collapsed": false,
                "gridPos": {
                    "h": 1,
                    "w": 24,
                    "x": 0,
                    "y": 0
                },
                "id": 100,
                "title": "Application Metrics (FastAPI Backend)",
                "type": "row"
            },
            {
                "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                },
                "fieldConfig": {
                    "defaults": {
                        "color": {
                            "mode": "palette-classic"
                        },
                        "custom": {
                            "axisBorderShow": false,
                            "axisCenteredZero": false,
                            "axisColorMode": "text",
                            "axisLabel": "req/s",
                            "drawStyle": "line",
                            "fillOpacity": 15,
                            "gradientMode": "none",
                            "lineWidth": 2
                        },
                        "unit": "reqps"
                    },
                    "overrides": []
                },
                "gridPos": {
                    "h": 8,
                    "w": 8,
                    "x": 0,
                    "y": 1
                },
                "id": 1,
                "title": "HTTP Request Rate (RPS)",
                "type": "timeseries",
                "targets": [
                    {
                        "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                        },
                        "editorMode": "code",
                        "expr": "sum(rate(http_requests_total[1m])) by (handler)",
                        "legendFormat": "{{handler}}",
                        "range": true,
                        "refId": "A"
                    }
                ]
            },
            {
                "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                },
                "fieldConfig": {
                    "defaults": {
                        "color": {
                            "mode": "palette-classic"
                        },
                        "custom": {
                            "axisLabel": "Latency (s)",
                            "drawStyle": "line",
                            "fillOpacity": 15,
                            "lineWidth": 2
                        },
                        "unit": "s"
                    },
                    "overrides": []
                },
                "gridPos": {
                    "h": 8,
                    "w": 8,
                    "x": 8,
                    "y": 1
                },
                "id": 2,
                "title": "P95 Response Time (Latency)",
                "type": "timeseries",
                "targets": [
                    {
                        "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                        },
                        "editorMode": "code",
                        "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
                        "legendFormat": "P95 Latency",
                        "range": true,
                        "refId": "A"
                    }
                ]
            },
            {
                "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                },
                "fieldConfig": {
                    "defaults": {
                        "color": {
                            "mode": "palette-classic"
                        },
                        "custom": {
                            "axisLabel": "% Error",
                            "drawStyle": "line",
                            "fillOpacity": 20,
                            "lineWidth": 2
                        },
                        "unit": "percent"
                    },
                    "overrides": []
                },
                "gridPos": {
                    "h": 8,
                    "w": 8,
                    "x": 16,
                    "y": 1
                },
                "id": 3,
                "title": "HTTP Error Rate (4xx / 5xx)",
                "type": "timeseries",
                "targets": [
                    {
                        "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                        },
                        "editorMode": "code",
                        "expr": "(sum(rate(http_requests_total{status=~\"[45]..\"}[1m])) / sum(rate(http_requests_total[1m]))) * 100",
                        "legendFormat": "Error Rate %",
                        "range": true,
                        "refId": "A"
                    }
                ]
            },
            {
                "collapsed": false,
                "gridPos": {
                    "h": 1,
                    "w": 24,
                    "x": 0,
                    "y": 9
                },
                "id": 101,
                "title": "Pod Resource Usage",
                "type": "row"
            },
            {
                "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                },
                "fieldConfig": {
                    "defaults": {
                        "color": {
                            "mode": "palette-classic"
                        },
                        "custom": {
                            "drawStyle": "line",
                            "fillOpacity": 15,
                            "lineWidth": 2
                        },
                        "unit": "short"
                    },
                    "overrides": []
                },
                "gridPos": {
                    "h": 8,
                    "w": 12,
                    "x": 0,
                    "y": 10
                },
                "id": 4,
                "title": "Backend Pod CPU Usage (Cores)",
                "type": "timeseries",
                "targets": [
                    {
                        "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                        },
                        "editorMode": "code",
                        "expr": "sum(rate(container_cpu_usage_seconds_total{container=\"backend\"}[1m])) by (pod)",
                        "legendFormat": "{{pod}}",
                        "range": true,
                        "refId": "A"
                    }
                ]
            },
            {
                "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                },
                "fieldConfig": {
                    "defaults": {
                        "color": {
                            "mode": "palette-classic"
                        },
                        "custom": {
                            "drawStyle": "line",
                            "fillOpacity": 15,
                            "lineWidth": 2
                        },
                        "unit": "bytes"
                    },
                    "overrides": []
                },
                "gridPos": {
                    "h": 8,
                    "w": 12,
                    "x": 12,
                    "y": 10
                },
                "id": 5,
                "title": "Backend Pod Memory Usage (RAM)",
                "type": "timeseries",
                "targets": [
                    {
                        "datasource": {
                            "type": "prometheus",
                            "uid": "prometheus"
                        },
                        "editorMode": "code",
                        "expr": "sum(container_memory_working_set_bytes{container=\"backend\"}) by (pod)",
                        "legendFormat": "{{pod}}",
                        "range": true,
                        "refId": "A"
                    }
                ]
            }
        ],
        "refresh": "5s",
        "schemaVersion": 38,
        "style": "dark",
        "tags": [
            "microservices",
            "fastapi",
            "todo-app"
        ],
        "time": {
            "from": "now-15m",
            "to": "now"
        },
        "timepicker": {
            "refresh_intervals": [
                "5s",
                "10s",
                "30s",
                "1m"
            ]
        },
        "timezone": "browser",
        "title": "Microservices Todo System Dashboard",
        "version": 1
    }
    

