apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s # Thu thập số liệu mỗi 15s
      evaluation_interval: 15s # Kiểm tra alert mỗi 15s
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager-service:9093']

    rule_files:
      - /etc/prometheus/alert-rules.yml
    
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      - job_name: 'backend-service'
        metrics_path: '/metrics' 
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: backend

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  alert-rules.yml: |
    groups:
      - name: microservices-alert 
        rules:
          - alert: HighHttpErrorRate
            expr: sum(rate(http_requests_total{status=~"5.*"}[1m])) / sum(rate(http_requests_total[1m])) * 100 > 3
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Tỷ lệ lỗi HTTP 5xx vượt quá 3%"
              description: "Backend đang gặp sự cố với tỷ lệ lỗi server cao bất thường!"
      
          - alert: PodDown
            expr: up == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Instance/Pod bị mất kết nối!" 
              description: "Target không phản hồi trong hơn 1 phút."