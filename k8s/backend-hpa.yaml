# TỰ ĐỘNG TĂNG GIẢM POD KHI TẢI THAY ĐỔI
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend # Áp dụng cho deployment backend
  minReplicas: 2 # Số Pod tối thiểu duy trì hệ thống
  maxReplicas: 10 # Số Pod tối đa được phép tăng lên khi tải tăng cao
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 15 # Chỉ đợi 15 giây sau khi hết tải là bắt đầu hạ Pod ngay (tối ưu khi demo)
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 8
          periodSeconds: 15
      selectPolicy: Max
    scaleUp:
      stabilizationWindowSeconds: 0 # Khi có tải là scale up tức thì
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

