apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  ALGORITHM: "HS256" #Thuật toán mã hóa JWT
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REDIS_URL: "redis://redis:6379/0"

---

apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque # kiểu secrect mặc định lưu cặp key-value tùy ý
stringData:
  DATABASE_URL: postgresql://todo_user:todo_password@postgres:5432/todo_db
  SECRET_KEY: "supersecrectjwtkeychangeinproduction"